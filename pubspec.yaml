name: human_bpo
description: Sherize — Production mobile app for task workers.
publish_to: 'none'
version: 2.1.5+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  lucide_icons: ^0.257.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  http: ^1.2.0
  intl: ^0.19.0
  image_picker: ^1.2.1
  image_picker_for_web: ^3.1.0
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  firebase_storage: ^13.1.0
  url_launcher: ^6.3.2
  firebase_messaging: ^16.1.2
  flutter_local_notifications: ^21.0.0
  cloud_functions: ^6.0.7
  google_sign_in: ^6.2.1
  file_picker: ^10.3.10
  csv: ^5.0.2
  excel: ^4.0.6
  firebase_auth_platform_interface: ^8.1.8
  pinput: ^6.0.2
  video_player: ^2.8.6
  just_audio: ^0.10.5
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  animations: ^2.0.11
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.2.0
  package_info_plus: ^9.0.1
  firebase_app_check: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.13.1
  fake_cloud_firestore: ^4.1.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/a71929d5-525c-4e33-aa89-8db3d873ee7c.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/a71929d5-525c-4e33-aa89-8db3d873ee7c.png"

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Thin.ttf
          weight: 100
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
  assets:
    - assets/images/
    - assets/images/sherize_logo.png
    - assets/plant_growth_new.mp4
    - assets/icons/
